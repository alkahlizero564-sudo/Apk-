name: engines
# Builds a real APK of the demo app of every language whenever an engine, the factory or the build changes.
on:
  push:
    paths: ["engines/**", "factory/**", ".github/workflows/build.yml", ".github/workflows/engines.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: One permanent signing key before the parallel builds
        env:
          ALPHA_KEYSTORE_B64: ${{ secrets.ALPHA_KEYSTORE_B64 }}
          ALPHA_KEYSTORE_PASSWORD: ${{ secrets.ALPHA_KEYSTORE_PASSWORD }}
        run: |
          python3 factory/sign.py --ensure
          if [ -n "$(git status --porcelain signing)" ]; then
            git config user.name "alpha-bot"; git config user.email "alpha-bot@users.noreply.github.com"
            git add signing && git commit -m "Permanent signing key" && git push
          fi

  demo:
    needs: key
    strategy:
      fail-fast: false
      matrix:
        app: [demo-html, demo-php, demo-flutter, demo-python, demo-kotlin]
    uses: ./.github/workflows/build.yml
    with:
      app: ${{ matrix.app }}
      notes: "Engine check"
    secrets: inherit
